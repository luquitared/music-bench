[project]
name = "music-bench"
version = "0.1.0"
description = "Can audio models hear music? Chords, key, tempo, instruments and lyrics, scored against ground truth."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "jiwer>=4.0.0",
    "mido>=1.3.3",
    "mir-eval>=0.8.2",
    "numpy>=2.5.5",
    "yt-dlp>=2026.11.23",
]
